<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">A dark editorial illustration showing two cookie-shaped key tags labeled with a shared token prefix and differing 3-character suffixes, with a grid of scrambled letters behind them resolving into the correct combination, symbolizing the brute-force discovery in the GIFT LAB writeup.</desc>
